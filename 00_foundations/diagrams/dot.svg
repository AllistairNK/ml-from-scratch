</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="516" height="273" rx="8"/>
<text x="20.0" y="26.0" font-size="14" text-anchor="start" class="mono title">a @ b   (dot product)    a = [1, 2, 3],  b = [4, 0, -1]</text>
<rect x="81" y="61" width="40" height="40" rx="3" fill="#4c6ef5" fill-opacity="0.24" stroke="#4c6ef5" stroke-width="1.3" opacity="1"/>
