<text x="241.0" y="201.0" font-size="12" text-anchor="middle" class="mono muted">sum</text>
<rect x="275" y="189" width="40" height="40" rx="3" fill="#ae3ec9" fill-opacity="0.24" stroke="#ae3ec9" stroke-width="1.3" opacity="1"/>
<text x="295.0" y="214.2" font-size="15" text-anchor="middle" class="mono" opacity="1">1</text>
<text x="80.0" y="252.0" font-size="12" text-anchor="start" class="muted">multiply matching positions, then add up:  4 + 0 − 3 = 1</text>
