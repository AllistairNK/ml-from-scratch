<svg xmlns="http://www.w3.org/2000/svg" width="517" height="274" viewBox="0 0 517 274" role="img" aria-label="Dot product: multiply matching positions, then add the results">
<title>Dot product: multiply matching positions, then add the results</title>
<style>
.bg { fill: #ffffff; stroke: #e2e0da; }
