<text x="101.0" y="214.2" font-size="15" text-anchor="middle" class="mono" opacity="1">4</text>
<rect x="123" y="189" width="40" height="40" rx="3" fill="#f08c00" fill-opacity="0.24" stroke="#f08c00" stroke-width="1.3" opacity="1"/>
<text x="143.0" y="214.2" font-size="15" text-anchor="middle" class="mono" opacity="1">0</text>
