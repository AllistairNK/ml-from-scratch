<svg xmlns="http://www.w3.org/2000/svg" width="611" height="280" viewBox="0 0 611 280" role="img" aria-label="Matrix times vector: each row of X dotted with w gives one output per row">
<title>Matrix times vector: each row of X dotted with w gives one output per row</title>
<style>
.bg { fill: #ffffff; stroke: #e2e0da; }
text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1f1f1d; white-space: pre; }
.mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
.muted { fill: #6b6a65; }
.title { font-weight: 600; }
.cellline { stroke: #9a9993; }
.arrow { stroke: #77766f; stroke-width: 1.6; fill: none; }
.ah { fill: #77766f; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1f1f1e; stroke: #353532; }
  text { fill: #ecebe6; }
  .muted { fill: #a3a29a; }
  .cellline { stroke: #6d6c66; }
  .arrow { stroke: #a3a29a; }
  .ah { fill: #a3a29a; }
}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="610" height="279" rx="8"/>
<text x="20.0" y="26.0" font-size="15" text-anchor="start" class="mono title">X @ w    (3, 2) @ (2,) → (3,)</text>
<text x="20.0" y="44.0" font-size="12" text-anchor="start" class="muted">each row of X is dotted with w: one result per sample</text>
<rect x="71" y="85" width="40" height="40" rx="3" fill="none" fill-opacity="0" class="cellline" stroke-width="1.3" opacity="1"/>
<text x="91.0" y="110.2" font-size="15" text-anchor="middle" class="mono" opacity="1">1</text>
<rect x="113" y="85" width="40" height="40" rx="3" fill="none" fill-opacity="0" class="cellline" stroke-width="1.3" opacity="1"/>
<text x="133.0" y="110.2" font-size="15" text-anchor="middle" class="mono" opacity="1">2</text>
<rect x="71" y="127" width="40" height="40" rx="3" fill="#f08c00" fill-opacity="0.24" stroke="#f08c00" stroke-width="1.3" opacity="1"/>
<text x="91.0" y="152.2" font-size="15" text-anchor="middle" class="mono" opacity="1">3</text>
<rect x="113" y="127" width="40" height="40" rx="3" fill="#f08c00" fill-opacity="0.24" stroke="#f08c00" stroke-width="1.3" opacity="1"/>
<text x="133.0" y="152.2" font-size="15" text-anchor="middle" class="mono" opacity="1">4</text>
<rect x="71" y="169" width="40" height="40" rx="3" fill="none" fill-opacity="0" class="cellline" stroke-width="1.3" opacity="1"/>
<text x="91.0" y="194.2" font-size="15" text-anchor="middle" class="mono" opacity="1">5</text>
<rect x="113" y="169" width="40" height="40" rx="3" fill="none" fill-opacity="0" class="cellline" stroke-width="1.3" opacity="1"/>
<text x="133.0" y="194.2" font-size="15" text-anchor="middle" class="mono" opacity="1">6</text>
<text x="62.0" y="109.0" font-size="12" text-anchor="end" class="muted">sample 0</text>
<text x="62.0" y="151.0" font-size="12" text-anchor="end" class="muted">sample 1</text>
<text x="62.0" y="193.0" font-size="12" text-anchor="end" class="muted">sample 2</text>
<text x="91.0" y="77.0" font-size="12" text-anchor="middle" class="muted">f0</text>
<text x="133.0" y="77.0" font-size="12" text-anchor="middle" class="muted">f1</text>
<text x="70.0" y="228.0" font-size="12" text-anchor="start" class="mono muted">X: (3, 2)</text>
<text x="174.0" y="146.0" font-size="24" text-anchor="middle" class="muted">@</text>
<rect x="195" y="106.0" width="40" height="40" rx="3" fill="#f08c00" fill-opacity="0.24" stroke="#f08c00" stroke-width="1.3" opacity="1"/>
<text x="215.0" y="131.2" font-size="15" text-anchor="middle" class="mono" opacity="1">0.5</text>
<rect x="195" y="148.0" width="40" height="40" rx="3" fill="#f08c00" fill-opacity="0.24" stroke="#f08c00" stroke-width="1.3" opacity="1"/>
<text x="215.0" y="173.2" font-size="15" text-anchor="middle" class="mono" opacity="1">−1</text>
<text x="194.0" y="207.0" font-size="12" text-anchor="start" class="mono muted">w: (2,)</text>
<text x="258.0" y="146.0" font-size="24" text-anchor="middle" class="muted">=</text>
<rect x="281" y="85" width="40" height="40" rx="3" fill="none" fill-opacity="0" class="cellline" stroke-width="1.3" opacity="1"/>
<text x="301.0" y="110.2" font-size="15" text-anchor="middle" class="mono" opacity="1">−1.5</text>
<rect x="281" y="127" width="40" height="40" rx="3" fill="#f08c00" fill-opacity="0.24" stroke="#f08c00" stroke-width="1.3" opacity="1"/>
<text x="301.0" y="152.2" font-size="15" text-anchor="middle" class="mono" opacity="1">−2.5</text>
<rect x="281" y="169" width="40" height="40" rx="3" fill="none" fill-opacity="0" class="cellline" stroke-width="1.3" opacity="1"/>
<text x="301.0" y="194.2" font-size="15" text-anchor="middle" class="mono" opacity="1">−3.5</text>
<text x="280.0" y="228.0" font-size="12" text-anchor="start" class="mono muted">(3,)</text>
<text x="336.0" y="151.0" font-size="12" text-anchor="start" class="" style="fill:#f08c00">3×0.5 + 4×(−1) = −2.5</text>
<text x="20.0" y="258.0" font-size="12" text-anchor="start" class="muted">Shape rule: (n, k) @ (k, m) → (n, m). The inner sizes must match, and they disappear.</text>
</svg>
