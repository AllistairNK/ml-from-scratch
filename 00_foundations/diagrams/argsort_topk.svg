<svg xmlns="http://www.w3.org/2000/svg" width="582" height="432" viewBox="0 0 582 432" role="img" aria-label="KNN: argsort the distances, keep the first k indexes, and look up their labels">
<title>KNN: argsort the distances, keep the first k indexes, and look up their labels</title>
<style>
.bg { fill: #ffffff; stroke: #e2e0da; }
